name: MADpilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-chibios:
    name: Build Plane & Bootloader (${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        board:
          - MatekH743
          - MatekH743-madpilot
          - MADpilotH7

    env:
      PATH: /usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage hub board definition
        run: |
          if [ -d "hwdef/MADpilotH7" ]; then
            cp -r hwdef/MADpilotH7 ardupilot/libraries/AP_HAL_ChibiOS/hwdef/
          fi

      - name: Build Bootloader (${{ matrix.board }})
        working-directory: ardupilot
        run: |
          mkdir -p ../staging/${{ matrix.board }}
          if [ -f "libraries/AP_HAL_ChibiOS/hwdef/${{ matrix.board }}/hwdef-bl.dat" ]; then
            ./waf configure --board ${{ matrix.board }} --bootloader
            ./waf clean
            ./waf bootloader
            # Stage bootloader binaries before plane build
            cp build/${{ matrix.board }}/bin/AP_Bootloader.* ../staging/${{ matrix.board }}/ || true
          else
            # OEM board reuses base board bootloader (USE_BOOTLOADER_FROM_BOARD)
            BASE_BOARD=$(grep -E '^\s*USE_BOOTLOADER_FROM_BOARD\s+' "libraries/AP_HAL_ChibiOS/hwdef/${{ matrix.board }}/hwdef.dat" | awk '{print $2}')
            echo "OEM board ${{ matrix.board }} reuses bootloader from ${BASE_BOARD}"
            if [ -f "Tools/bootloaders/${BASE_BOARD}_bl.bin" ]; then
              cp "Tools/bootloaders/${BASE_BOARD}_bl.bin" "../staging/${{ matrix.board }}/AP_Bootloader.bin"
            else
              ./waf configure --board "${BASE_BOARD}" --bootloader
              ./waf clean
              ./waf bootloader
              cp build/"${BASE_BOARD}"/bin/AP_Bootloader.* ../staging/${{ matrix.board }}/ || true
            fi
          fi

      - name: Build Plane Firmware (${{ matrix.board }})
        working-directory: ardupilot
        run: |
          ./waf configure --board ${{ matrix.board }}
          ./waf clean
          ./waf plane
          # Stage plane firmware artifacts (.apj and .bin)
          cp build/${{ matrix.board }}/bin/arduplane.apj ../staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/bin/arduplane.bin ../staging/${{ matrix.board }}/ || true

      - name: Verify Staged Artifacts
        run: |
          echo "Staged artifacts for ${{ matrix.board }}:"
          ls -lh staging/${{ matrix.board }}/
          test -f staging/${{ matrix.board }}/arduplane.apj
          test -f staging/${{ matrix.board }}/AP_Bootloader.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-plane-artifacts
          path: staging/${{ matrix.board }}/
          retention-days: 14
          if-no-files-found: error

  sitl-smoke:
    name: SITL Failsafe Smoke Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install "empy==3.3.4" future pymavlink pyserial pexpect ptyprocess

      - name: Build SITL Plane
        working-directory: ardupilot
        run: |
          ./waf configure --board sitl
          ./waf plane

      - name: Run SITL Failsafe Smoke Test
        run: |
          python3 scripts/sitl_smoke.py \
            --binary ardupilot/build/sitl/bin/arduplane \
            --defaults ardupilot/libraries/AP_HAL_ChibiOS/hwdef/MatekH743-madpilot/defaults.parm \
            --verbose

