name: MADpilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-chibios:
    name: Build Plane & Bootloader (${{ matrix.board }})
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        board:
          - MatekH743

    env:
      PATH: /usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Bootloader (${{ matrix.board }})
        working-directory: ardupilot
        run: |
          mkdir -p ../staging/${{ matrix.board }}
          ./waf configure --board ${{ matrix.board }} --bootloader
          ./waf clean
          ./waf bootloader
          # Stage bootloader binaries before plane build
          cp build/${{ matrix.board }}/bin/AP_Bootloader.* ../staging/${{ matrix.board }}/ || true

      - name: Build Plane Firmware (${{ matrix.board }})
        working-directory: ardupilot
        run: |
          ./waf configure --board ${{ matrix.board }}
          ./waf clean
          ./waf plane
          # Stage plane firmware artifacts (.apj and .bin)
          cp build/${{ matrix.board }}/bin/arduplane.apj ../staging/${{ matrix.board }}/
          cp build/${{ matrix.board }}/bin/arduplane.bin ../staging/${{ matrix.board }}/ || true

      - name: Verify Staged Artifacts
        run: |
          echo "Staged artifacts for ${{ matrix.board }}:"
          ls -lh staging/${{ matrix.board }}/
          test -f staging/${{ matrix.board }}/arduplane.apj
          test -f staging/${{ matrix.board }}/AP_Bootloader.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-plane-artifacts
          path: staging/${{ matrix.board }}/
          retention-days: 14
          if-no-files-found: error
